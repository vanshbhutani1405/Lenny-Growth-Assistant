[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-growth-assistant"
version = "0.1.0"
description = "Backend foundation for the Lenny Growth Assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "claude-agent-sdk>=0.2,<1.0",
    "fastapi>=0.115,<1.0",
    "pgvector>=0.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sentence-transformers>=3.0,<6.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20,<1.0", "httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.8,<1.0"]
observability = ["langsmith>=0.3,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
